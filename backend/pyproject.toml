[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["postgres: requires a PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 115
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
