name: govbr-mcp

x-app: &app
  build:
    context: ./backend
  image: govbr-mcp-backend:local
  env_file: .env
  environment:
    GOVBR_DATABASE_URL: postgresql+psycopg://govbr:${GOVBR_DB_PASSWORD:?Execute o script de inicialização}@postgres:5432/govbr
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: govbr
      POSTGRES_USER: govbr
      POSTGRES_PASSWORD: ${GOVBR_DB_PASSWORD:?Execute o script de inicialização}
    volumes: [db:/var/lib/postgresql/data]
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=32", "-c", "statement_timeout=45000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govbr -d govbr"]
      interval: 5s
      timeout: 4s
      retries: 14
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["python", "-m", "govbr", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  backend:
    <<: *app
    ports: ["127.0.0.1:${GOVBR_PORT:-8787}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 7
    restart: unless-stopped
  frontend:
    build: ./frontend
    profiles: [painel]
    ports: ["127.0.0.1:${GOVBR_PANEL_PORT:-8788}:8080"]
    depends_on:
      backend:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    environment:
      GOVBR_DOMAIN: ${GOVBR_DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  caddy_data:
  caddy_config:
